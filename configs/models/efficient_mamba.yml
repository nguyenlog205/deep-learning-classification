# --- SYSTEM & DATA ---
model_name: "efficient_mamba"
data_root: "./data/training_dataset"
checkpoints_dir: "./models/checkpoints/efficient_mamba"

# Dữ liệu Video
num_frames: 64
batch_size: 4
num_workers: 4

# --- MODEL ARCHITECTURE (Mamba Specific) ---
d_model: 512
num_layers: 2

# Các tham số đặc trưng của Mamba (SSM)
d_state: 16
d_conv: 4
expand: 2

dropout: 0.2

# --- TRAINING HYPERPARAMETERS ---
epochs: 30
lr: 1.0e-5
weight_decay: 1.0e-4
patience: 5
accumulation_steps: 8
use_amp: true
label_smoothing: 0.1