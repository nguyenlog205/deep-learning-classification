name: ai_env
channels:
  - conda-forge
  - nvidia
  - defaults
dependencies:
  - python=3.10.19
  - pip=25.3
  - ffmpeg=4.4.2           # Bắt buộc để OpenCV xử lý video mp4
  - libgcc-ng=15.2.0
  - pip:
      # --- AI Frameworks (Khớp bản cu121 máy ông) ---
      - torch==2.5.1 --index-url https://download.pytorch.org/whl/cu121
      - torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cu121
      - ultralytics==8.4.3
      - opencv-python==4.12.0.88
      - numpy==2.2.6
      
      # --- Web API (FastAPI stack) ---
      - fastapi==0.127.0
      - uvicorn[standard]==0.40.0
      - python-multipart==0.0.21
      - starlette==0.50.0
      
      # --- Đồ nghề xử lý Data & Config ---
      - pyyaml==6.0.3
      - pandas==2.3.3
      - pillow==12.0.0
      - tqdm==4.67.1
      - scikit-learn==1.7.2
      - matplotlib==3.10.8
      - pydantic==2.12.5